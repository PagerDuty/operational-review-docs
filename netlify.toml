
# netlify.toml — reviews.pagerduty.com
# This site now only redirects to docs.pagerduty.com/ops-guides/operational-reviews-guide.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# These are attached to the 301 responses too. Referrer-Policy matters here:
# a redirect response's Referrer-Policy is applied to the follow-up request,
# so "same-origin" would strip the referrer when the browser goes on to
# docs.pagerduty.com (cross-origin), and docs analytics would lose the
# original traffic source (Google, blogs, Slack, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Redirects — first match wins. Keep the catch-all LAST.
# force = true is required because the old MkDocs build output (if still
# deployed) would otherwise shadow these rules.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide"
  status = 301
  force = true

[[redirects]]
  from = "/introduction/*"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide/introduction"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/oncall/*"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide/on-call-review"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/service/*"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide/service-review"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/business/*"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide/business-review"
  status = 301
  force = true

[[redirects]]
  from = "/definitions/*"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide/definitions"
  status = 301
  force = true

[[redirects]]
  from = "/next_steps/*"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide/next-steps"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide/additional-resources"
  status = 301
  force = true

# Catch-all: assets, sitemap.xml, search index, /reviews/,
# unknown/mistyped URLs
[[redirects]]
  from = "/*"
  to = "https://docs.pagerduty.com/ops-guides/operational-reviews-guide"
  status = 301
  force = true
